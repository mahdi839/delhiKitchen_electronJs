<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>Menu</title>
    <style>
        :root {
            --line: rgba(212, 162, 76, .28);
            --gold: #d4a24c;
            --gold-2: #f3d7a0;
            --ink: #f6f1e8;
            --muted: #9aa6b8;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            background: #101827;
            color: var(--ink);
            font-family: "Segoe UI", "Trebuchet MS", sans-serif;
            user-select: none;
        }
        .panel {
            display: grid;
            gap: 6px;
            padding: 8px;
            height: 100%;
            overflow: auto;
            align-content: start;
        }
        button {
            border: 0;
            cursor: pointer;
            font: inherit;
            height: 36px;
            width: 100%;
            padding: 0 12px;
            border-radius: 12px;
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, .14);
        }
        button:hover { filter: brightness(1.12); }
        .nav-orders { background: #4338ca; }
        .nav-kot { background: #b45309; }
        .nav-bills { background: #334155; }
        .nav-settings { background: #7d0ba7; }
        .ghost {
            background: #1e3a5f;
            color: #e2e8f0;
            border: 1px solid rgba(243, 215, 160, .35);
        }
        .gold {
            background: linear-gradient(180deg, var(--gold-2), var(--gold));
            color: #2a1b06;
        }
        .kicker {
            margin: 4px 2px 0;
            color: var(--gold);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
        }
        .copy {
            margin: 0 2px 6px;
            font-size: 13px;
            font-weight: 700;
        }
        select {
            width: 100%;
            background: #0f1624;
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px;
        }
        .badge {
            display: inline-block;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
        }
        .online { background: rgba(52, 211, 153, .15); color: #bbf7d0; }
        .offline { background: rgba(248, 113, 113, .15); color: #fecaca; }
    </style>
</head>
<body>
    <div class="panel" id="panel"></div>
    <script src="menu-popup.js"></script>
</body>
</html>
